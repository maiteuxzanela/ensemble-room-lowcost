name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # TICKET-HARNESS-89: pin EXATO no piso do "engines" (>=22.23.4) com
          # check-latest: true — pega o patch mais recente da linha 22.x sem
          # nunca cair em major flutuante nem abaixo do piso exato.
          node-version: "22.23.4"
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci

      - name: Build bundle (dist/index.js)
        run: npm run build

      - name: Syntax check bundle
        run: npm run check

      - name: Typecheck sources
        run: npm run typecheck

      # Hermetic suite (TICKET-RELEASE-01): schema from tests/fixtures, no host store.
      - name: Run deterministic test suite
        run: npm test

      - name: Publish to NPM
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
