name: Publish to NPM

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22.13+ ships node:sqlite without a flag and matches
          # package.json "engines": { "node": ">=22.13.0" }.
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci

      - name: Build bundle (dist/index.js)
        run: npm run build

      - name: Syntax check bundle
        run: npm run check

      - name: Typecheck sources
        run: npm run typecheck

      # Hermetic suite (TICKET-RELEASE-01): schema from tests/fixtures, no host store.
      - name: Run deterministic test suite
        run: npm test

      - name: Publish to NPM
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
