name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-suite:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite ships unflagged from 22.13; package.json "engines"
        # declares >=22.23.4 (hard floor: the nested dependency ini@7 requires
        # ^22.22.2 || ^24.15.0). TICKET-HARNESS-89: pins EXATOS por patch —
        # `check-latest: true` resolve o release mais recente QUE SATISFAZ o pin,
        # nunca um major flutuante. Floors: 22.23.4 e 24.22.1.
        node: ["22.23.4", "24.22.1"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm

      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci

      # Static gate, first and fastest: `biome check src` exits non-zero on any
      # error-severity violation (biome.jsonc escalates noExplicitAny to error
      # and keeps the rest of `recommended` at default severities, so style
      # warnings are reported but never fail the build by design).
      - name: Lint sources (biome)
        run: npx biome check src

      - name: Build bundle (dist/index.js)
        run: npm run build

      # Deterministic bundle-drift gate: every committed dist bundle must be
      # byte-identical to a fresh build from src/. Any drift (src changed
      # without rebuilding, or a hand-edited bundle) fails the job here, before
      # the test suite can mask it.
      #
      # `git diff --exit-code dist/` alone is BLIND to untracked files, so a
      # brand-new bundle (dist/rpc.js, dist/tui.js) could be built, never
      # committed, and the gate would still go green while `main` shipped
      # without it. The second command closes that hole: any untracked or
      # staged-but-uncommitted path under dist/ fails the job.
      - name: Verify bundle is in sync with src (dist drift)
        run: |
          git diff --exit-code dist/
          test -z "$(git status --porcelain dist/)"

      - name: Syntax check bundle
        run: npm run check

      - name: Typecheck sources
        run: npm run typecheck

      # Packaging smoke check: proves `files`/`exports` resolve into a real
      # tarball without publishing anything. Catches a broken package layout
      # before release, not at `npm publish` time.
      - name: Validate npm package tarball (dry run)
        run: npm pack --dry-run

      # Hermetic suites (TICKET-RELEASE-01): the real `session`/`project` DDL
      # comes from tests/fixtures/session_schema.sql and the standby upgrade
      # fixture is replayed from MIGRATIONS — no host store needed. The
      # extension contract (front B of test_emergency_pause) reports an
      # explicit N/A/SKIP when the extension is not vendored in this repo;
      # export ENSEMBLE_EXTENSION_DIR in a job that owns the extension to
      # exercise it end-to-end.
      - name: Run deterministic test suite
        run: npm test
