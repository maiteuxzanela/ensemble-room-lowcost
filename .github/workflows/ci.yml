name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-suite:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor where node:sqlite is available without a flag
        # (see package.json "engines": node >=22.13.0); 24 is the current LTS.
        node: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci

      - name: Build bundle (dist/index.js)
        run: npm run build

      - name: Syntax check bundle
        run: npm run check

      - name: Typecheck sources
        run: npm run typecheck

      # The deterministic suites are hermetic (TICKET-RELEASE-01): the real
      # `session`/`project` DDL comes from tests/fixtures/session_schema.sql,
      # so no host store (~/.local/share/opencode/opencode.db) is required.
      - name: Run deterministic test suite
        run: npm test
