name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-suite:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # node:sqlite ships unflagged from 22.13; package.json "engines"
        # declares >=22.22.2 (piso real: dependência aninhada ini@7 exige
        # ^22.22.2). setup-node resolve a 22.x/24.x atual, sempre acima do piso.
        node: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies (clean, lockfile-exact)
        run: npm ci

      - name: Build bundle (dist/index.js)
        run: npm run build

      - name: Syntax check bundle
        run: npm run check

      - name: Typecheck sources
        run: npm run typecheck

      # Hermetic suites (TICKET-RELEASE-01): the real `session`/`project` DDL
      # comes from tests/fixtures/session_schema.sql and the standby upgrade
      # fixture is replayed from MIGRATIONS — no host store needed. The
      # extension contract (front B of test_emergency_pause) reports an
      # explicit N/A/SKIP when the extension is not vendored in this repo;
      # export ENSEMBLE_EXTENSION_DIR in a job that owns the extension to
      # exercise it end-to-end.
      - name: Run deterministic test suite
        run: npm test
